name: Generate Keystore
on: workflow_dispatch
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - run: keytool -genkeypair -v -keystore release.keystore -alias r34 -keyalg RSA -keysize 2048 -validity 10000 -storepass r34pass -keypass r34pass -dname "CN=r34"
      - uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.keystore
